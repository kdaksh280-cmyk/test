<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blinkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <nav>
        <div id="logo">
             <img src="./assets/logo.png" width="100px" height="50px" alt="Blinkit Logo">
          </div>
        <div class="location">
            <h4>Delivery in 17 minutes</h4>
            <p>Meerut Uttar Pradesh</p>
</div>
         <div class="search-box">
        <i class="search-product"></i>
         <input type="text" placeholder="Search products">

        </div>
<div class="nav-buttons">
    <button class="login">Login</button>

    <button class="cart">
        My Cart
    </button>
</div>

      </nav>
       <section class="main">
        <div class="content">
            <!-- <image src="./assets/header (1).png" -->
            <h1>Stock up on daily essentials</h1>
            <p>Get farm-fresh goodness & a range of exotic fruits, vegetables, eggs & more</p>
            <button>Shop Now</button>
        </div>
    </section>
    <section class="cards">
<div class="card1">
    <h2>Pharmacy at your doorstep!</h2>
    <button>Order Now</button>
        </div>
 <div class="card2">
    <h2>Pet care supplies at your door</h2>
    <button>Order Now</button>
        </div>
         <div class="card3">
            <h2>No time for a diaper run?</h2>
            <button>Order Now</button>
        </div>
</section>
</header>
</body>
</html>
